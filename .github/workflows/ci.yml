name: Quality and release checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm run audit
      - run: bash -n scripts/deploy-web.sh scripts/rollback-web.sh scripts/vm-common.sh
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: apps/web/out
          retention-days: 3

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:container
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 3
